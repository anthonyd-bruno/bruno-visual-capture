info:
  name: List users
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users"
  headers:
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "{{apiVersion}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
