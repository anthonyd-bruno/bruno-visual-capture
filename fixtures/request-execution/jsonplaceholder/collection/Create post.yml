info:
  name: Create post
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/posts"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      { "title": "Hello from Bruno", "body": "Captured by Bruno Capture", "userId": 1 }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
