info:
  name: Bearer auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/bearer"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

docs: |-
  # Bearer auth

  `GET /bearer` answers **200** with the bearer token it received, or **401** when the
  `Authorization` header is missing.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
