info:
  name: Basic auth
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/basic-auth/demo/secret"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

docs: |-
  # Basic auth

  `GET /basic-auth/demo/secret` answers **200** for the user `demo` with the password `secret`,
  otherwise **401**.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
