info:
  name: Multipart form
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/posts"
  body:
    type: multipart-form
    data:
      - name: title
        type: text
        value: Hello from Bruno
      - name: body
        type: text
        value: Sent as multipart
      - name: userId
        type: text
        value: "1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
