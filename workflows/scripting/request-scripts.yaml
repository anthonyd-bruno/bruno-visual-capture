version: 1
id: request-scripts
name: Pre-request and Post-response Scripts
description: Shows a request's pre-request and post-response scripts on the Script tab, sends the request and shows the response and the test that reads the stored variable.
feature: scripting
tags: [scripts, pre-request, post-response, scripting]
supportedOutputs: [screenshots, video, gif]
fixture:
  source: bundled
  path: scripting/jsonplaceholder-scripts
defaults:
  preset: docs-screenshot
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Scripting Demo }
  - action: request.open
    params: { name: Get user }
  - action: request.selectTab
    params: { tab: script }
  - action: request.selectScriptPhase
    params: { phase: pre-request }
  - pause: 500
  - capture:
      id: script-pre-request
      name: Pre-request script
  - action: request.selectScriptPhase
    params: { phase: post-response }
  - pause: 500
  - capture:
      id: script-post-response
      name: Post-response script
  - startRecording: {}
  - action: request.send
  - waitFor:
      state: response.received
  - pause: 600
  - capture:
      id: script-response
      name: Response after the scripts ran
  - action: response.selectTab
    params: { tab: tests }
  - pause: 600
  - capture:
      id: script-test-result
      name: Test reading the variable the script stored
  - stopRecording: {}
