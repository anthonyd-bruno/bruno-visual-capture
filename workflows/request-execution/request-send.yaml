version: 1
id: request-send-response
name: Send a Request
description: Opens a POST request, shows its JSON body, sends it and displays the response.
feature: request-execution
tags: [request, response, demo]
supportedOutputs: [screenshots, video, gif]
parameters:
  request:
    type: select
    label: Request
    options: [Create post, Get user]
    default: Create post
fixture:
  source: bundled
  path: request-execution/jsonplaceholder
defaults:
  preset: demo-video
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: JSONPlaceholder }
  - action: request.open
    params: { name: "{{request}}" }
  - capture:
      id: request-selected
      name: Request selected in the sidebar and editor
  - action: request.selectTab
    params: { tab: body }
  - capture:
      id: request-configured
      name: Request body configured
  - startRecording: {}
  - action: request.send
  - waitFor:
      state: response.received
  - pause: 700
  - capture:
      id: response-displayed
      name: Response displayed
  - stopRecording: {}
