version: 1
id: request-docs
name: Document a Request
description: Shows a request's Docs tab rendered as Markdown, then switches it to edit mode.
feature: documentation
tags: [docs, markdown, documentation]
supportedOutputs: [screenshots, video, gif]
parameters:
  request:
    type: select
    label: Request
    options: [Get user, List posts, Create post]
    default: Get user
fixture:
  source: bundled
  path: authoring/blog-api
defaults:
  preset: docs-screenshot
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Blog API }
  - action: request.open
    params: { name: "{{request}}" }
  - startRecording: {}
  - action: request.selectTab
    params: { tab: docs }
  - pause: 600
  - capture:
      id: docs-rendered
      name: Request documentation rendered
  - action: ui.click
    params: { testId: docs-edit-toggle }
    label: Switch the docs to edit mode
  - pause: 600
  - capture:
      id: docs-editing
      name: Editing the documentation
  - action: ui.click
    params: { testId: docs-edit-toggle }
    label: Back to the rendered view
  - pause: 400
  - stopRecording: {}
