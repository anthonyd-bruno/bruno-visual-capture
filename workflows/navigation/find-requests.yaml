version: 1
id: find-requests
name: Find Requests with Search
description: Uses Global Search to find requests across the workspace, then filters the sidebar with the request search field.
feature: navigation
tags: [search, sidebar, navigation]
supportedOutputs: [screenshots, video, gif]
parameters:
  globalQuery:
    type: string
    label: Global search query
    default: user
  sidebarQuery:
    type: string
    label: Sidebar filter
    default: albums
fixture:
  source: bundled
  path: runner/folder-workspace
defaults:
  preset: demo-video
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Folders Demo }
  - startRecording: {}
  - action: search.global
    params: { query: "{{globalQuery}}" }
  - pause: 700
  - capture:
      id: global-search-results
      name: Global Search results
  - action: ui.press
    params: { key: Escape }
  - pause: 400
  - action: search.sidebar
    params: { query: "{{sidebarQuery}}" }
  - pause: 600
  - capture:
      id: sidebar-filtered
      name: Sidebar filtered by the search field
  - stopRecording: {}
