version: 1
id: folder-settings
name: Folder Settings
description: Opens a folder's settings and shows its Headers, Auth and Vars tabs.
feature: collection-settings
tags: [folder, settings, headers, auth]
supportedOutputs: [screenshots, video]
fixture:
  source: bundled
  path: runner/folder-workspace
defaults:
  preset: docs-screenshot
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Folders Demo }
  - startRecording: {}
  - action: folder.openSettings
    params: { name: Users, tab: headers }
  - pause: 600
  - capture:
      id: folder-headers
      name: Folder-level headers
  - action: ui.click
    params: { testId: folder-settings-tab-auth }
    label: Auth tab
  - pause: 500
  - capture:
      id: folder-auth
      name: Folder auth (inherited)
  - action: ui.click
    params: { testId: folder-settings-tab-vars }
    label: Vars tab
  - pause: 500
  - capture:
      id: folder-vars
      name: Folder variables
  - stopRecording: {}
