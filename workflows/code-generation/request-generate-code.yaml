version: 1
id: request-generate-code
name: Generate Code for a Request
description: Opens Generate Code for a request and shows the snippet in the chosen language.
feature: code-generation
tags: [generate-code, snippet, curl]
supportedOutputs: [screenshots, video, gif]
parameters:
  request:
    type: select
    label: Request
    options: [Create post, List posts, Get user]
    default: Create post
  language:
    type: select
    label: Language
    options: [Shell, Python, JavaScript, Node.js, Go, Java, Ruby, PHP, Rust, Swift, C#, Kotlin, Powershell]
    default: Shell
fixture:
  source: bundled
  path: authoring/blog-api
defaults:
  preset: docs-screenshot
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Blog API }
  - action: request.open
    params: { name: "{{request}}" }
  - startRecording: {}
  - action: request.generateCode
    params: { name: "{{request}}", language: "{{language}}" }
  - waitFor:
      state: codegen.open
  - pause: 700
  - capture:
      id: generated-code
      name: Generated code for the request
  - stopRecording: {}
  - action: modal.close
