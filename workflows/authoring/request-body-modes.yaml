version: 1
id: request-body-modes
name: Request Body Types
description: Shows the Body tab for JSON, XML, Form URL Encoded, Multipart Form and plain-text requests, then sends the JSON one.
feature: authoring
tags: [body, json, xml, form, multipart]
supportedOutputs: [screenshots, video, gif]
fixture:
  source: bundled
  path: authoring/body-modes
defaults:
  preset: docs-screenshot
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Body Types }
  - startRecording: {}
  - action: request.open
    params: { name: JSON body }
  - action: request.selectTab
    params: { tab: body }
  - pause: 500
  - capture:
      id: body-json
      name: JSON body
  - action: request.open
    params: { name: XML body }
  - action: request.selectTab
    params: { tab: body }
  - pause: 500
  - capture:
      id: body-xml
      name: XML body
  - action: request.open
    params: { name: Form URL encoded }
  - action: request.selectTab
    params: { tab: body }
  - pause: 500
  - capture:
      id: body-form-urlencoded
      name: Form URL encoded body
  - action: request.open
    params: { name: Multipart form }
  - action: request.selectTab
    params: { tab: body }
  - pause: 500
  - capture:
      id: body-multipart
      name: Multipart form body
  - action: request.open
    params: { name: JSON body }
  - action: request.send
  - waitFor:
      state: response.received
  - pause: 700
  - capture:
      id: body-json-response
      name: Response echoing the JSON body
  - stopRecording: {}
