version: 1
id: request-rename-and-delete
name: Rename and Delete Requests
description: Renames a request from its sidebar menu, then deletes another one and confirms the dialog.
feature: authoring
tags: [rename, delete, sidebar, authoring]
supportedOutputs: [screenshots, video, gif]
parameters:
  newName:
    type: string
    label: New name for "Get user"
    default: Get user profile
fixture:
  source: bundled
  path: authoring/blog-api
defaults:
  preset: demo-video
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Blog API }
  - startRecording: {}
  - action: request.rename
    params: { name: Get user, newName: "{{newName}}" }
  - pause: 2400   # lets the "renamed" toast fade before the still
  - capture:
      id: request-renamed
      name: Request renamed in the sidebar
  - action: request.delete
    params: { name: List posts }
  - pause: 2400
  - capture:
      id: request-deleted
      name: Request removed from the collection
  - stopRecording: {}
