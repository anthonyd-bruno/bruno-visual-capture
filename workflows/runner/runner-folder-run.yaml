version: 1
id: runner-folder-run
name: Run a Folder
description: Runs only the requests of one folder through the Collection Runner dialog and shows the results.
feature: runner
tags: [runner, folder]
supportedOutputs: [screenshots, video, gif]
parameters:
  folder:
    type: select
    label: Folder
    options: [Users, Posts]
    default: Users
  recursive:
    type: boolean
    label: Include subfolders (Recursive Run)
    default: false
fixture:
  source: bundled
  path: runner/folder-workspace
defaults:
  preset: demo-video
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Folders Demo }
  - startRecording: {}
  - action: runner.runFolder
    params: { name: "{{folder}}", recursive: "{{recursive}}" }
  - waitFor:
      state: runner.complete
      timeoutMs: 60000
  - pause: 800
  - capture:
      id: folder-run-results
      name: Folder run results
  - stopRecording: {}
