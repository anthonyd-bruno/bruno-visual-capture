version: 1
id: request-tests-and-assertions
name: Tests and Assertions
description: Shows a request's Assert rows and Tests script, sends it and opens the response Tests tab with the passing results.
feature: testing
tags: [tests, assertions, testing]
supportedOutputs: [screenshots, video, gif]
parameters:
  request:
    type: select
    label: Request
    options: [Get user, List posts]
    default: Get user
fixture:
  source: bundled
  path: testing/jsonplaceholder-tests
defaults:
  preset: docs-screenshot
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Testing Demo }
  - action: request.open
    params: { name: "{{request}}" }
  - action: request.selectTab
    params: { tab: assert }
  - pause: 500
  - capture:
      id: assertions-configured
      name: Assertions on the Assert tab
  - action: request.selectTab
    params: { tab: tests }
  - pause: 500
  - capture:
      id: tests-script
      name: Test script on the Tests tab
  - startRecording: {}
  - action: request.send
  - waitFor:
      state: response.received
  - action: response.selectTab
    params: { tab: tests }
  - pause: 700
  - capture:
      id: test-results
      name: Test and assertion results
  - stopRecording: {}
