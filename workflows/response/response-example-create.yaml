version: 1
id: response-example-create
name: Save a Response as an Example
description: Sends a request, saves its response as a named Response Example and shows the example under the request in the sidebar.
feature: response
tags: [response, example, mock]
supportedOutputs: [screenshots, video, gif]
parameters:
  request:
    type: select
    label: Request
    options: [Get user, List posts, Create post]
    default: Get user
  exampleName:
    type: string
    label: Example name
    default: 200 OK example
fixture:
  source: bundled
  path: authoring/blog-api
defaults:
  preset: demo-video
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Blog API }
  - action: request.open
    params: { name: "{{request}}" }
  - startRecording: {}
  - action: request.send
  - waitFor:
      state: response.received
  - pause: 600
  - capture:
      id: response-to-save
      name: Response that will become the example
  - action: response.createExample
    params: { request: "{{request}}", name: "{{exampleName}}" }
  - pause: 2400
  - capture:
      id: response-example-saved
      name: Example saved under the request
  - stopRecording: {}
