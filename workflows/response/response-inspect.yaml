version: 1
id: response-inspect
name: Inspect a Response
description: Sends a request and shows the response body, then the response headers.
feature: response
tags: [response, headers, body]
supportedOutputs: [screenshots, video, gif]
parameters:
  request:
    type: select
    label: Request
    options: [Get user, List posts, Create post]
    default: Get user
fixture:
  source: bundled
  path: authoring/blog-api
defaults:
  preset: docs-screenshot
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Blog API }
  - action: request.open
    params: { name: "{{request}}" }
  - startRecording: {}
  - action: request.send
  - waitFor:
      state: response.received
  - pause: 700
  - capture:
      id: response-body
      name: Response body
  - action: response.selectTab
    params: { tab: headers }
  - pause: 600
  - capture:
      id: response-headers
      name: Response headers
  - stopRecording: {}
