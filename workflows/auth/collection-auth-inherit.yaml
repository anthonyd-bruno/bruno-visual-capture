version: 1
id: collection-auth-inherit
name: Collection-Level Auth Inherited by Requests
description: Sets a bearer token once in Collection Settings → Auth, saves it, then shows a request inheriting it and the authenticated response.
feature: auth
tags: [auth, collection, inherit, bearer]
supportedOutputs: [screenshots, video, gif]
parameters:
  token:
    type: string
    label: Bearer token
    default: shared-collection-token-789
  revealSecret:
    type: boolean
    label: Show the token in plain text
    default: true
fixture:
  source: bundled
  path: auth/httpbin
defaults:
  preset: demo-video
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Auth Demo }
  - startRecording: {}
  - action: collection.setAuth
    params: { collection: Auth Demo, mode: bearer, token: "{{token}}", reveal: "{{revealSecret}}" }
    label: Set Bearer Token in the collection settings
  - pause: 600
  - capture:
      id: collection-auth-configured
      name: Collection-level bearer token
  - action: collection.saveSettings
  - pause: 2400   # lets the "saved" toast fade before the next still
  - action: request.open
    params: { name: Bearer auth }
  - action: request.selectTab
    params: { tab: auth }
  - pause: 500
  - capture:
      id: request-auth-inherited
      name: Request inheriting the collection auth
  - action: request.send
  - waitFor:
      state: response.received
      timeoutMs: 30000
  - pause: 700
  - capture:
      id: inherited-auth-response
      name: Response confirming the inherited token
  - stopRecording: {}
