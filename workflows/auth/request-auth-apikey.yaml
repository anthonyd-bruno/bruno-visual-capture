version: 1
id: request-auth-apikey
name: Add an API Key
description: Switches a request's Auth tab to API Key, enters the header name and key, and sends it to an endpoint that echoes the headers it received.
feature: auth
tags: [auth, apikey, header]
supportedOutputs: [screenshots, video, gif]
parameters:
  key:
    type: string
    label: Header name
    default: X-API-Key
  value:
    type: string
    label: API key
    default: demo-api-key-456
fixture:
  source: bundled
  path: auth/httpbin
defaults:
  preset: docs-gif
steps:
  - action: workspace.open
  - action: collection.open
    params: { name: Auth Demo }
  - action: request.open
    params: { name: API key }
  - startRecording: {}
  - action: request.setAuth
    params: { mode: apikey, key: "{{key}}", value: "{{value}}" }
    label: Choose API Key and enter the key
  - pause: 600
  - capture:
      id: auth-apikey-configured
      name: API key configured
  - action: request.send
  - waitFor:
      state: response.received
      timeoutMs: 30000
  - pause: 700
  - capture:
      id: auth-apikey-response
      name: Response echoing the API key header
  - stopRecording: {}
